# Kineto.app Test Configuration
# ================================

# Base URL for the application under test
kineto.base.url=https://kineto.app

# Test Account Credentials (use environment variables in CI)
# kineto.test.email=${KINETO_TEST_EMAIL}
# kineto.test.password=${KINETO_TEST_PASSWORD}

# Browser Configuration
browser.headless=true
browser.window.width=1920
browser.window.height=1080

# Timeouts (in seconds)
timeout.implicit=10
timeout.explicit=30
timeout.page.load=60

# Test Execution
test.fail.fast=false
test.parallel.forks=1

# Reporting
report.screenshots.on.failure=true
